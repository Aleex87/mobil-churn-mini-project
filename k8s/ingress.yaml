apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saldes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - alessandro-abbate.89-167-53-206.sslip.io
      secretName: saldes-tls
  rules:
    - host: alessandro-abbate.89-167-53-206.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saldes
                port:
                  number: 80