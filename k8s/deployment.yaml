apiVersion: apps/v1
kind: Deployment
metadata:
  name: saldes
spec:
  replicas: 2

  # Start one extra replica without removing ready replicas first.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: saldes

  template:
    metadata:
      labels:
        app: saldes
    spec:
      containers:
        - name: api
          image: ghcr.io/aleex87/mobil-churn-mini-project:994b365a92924c34ac0172557b1ad28b2c23b3a7
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Wait for model loading before starting the other probes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          # Only ready replicas receive traffic.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2

          # Restart the container after repeated failures.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2