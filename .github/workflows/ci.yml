name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  workflow_dispatch:
    inputs:
      datafil:
        description: "Välj CSV-fil för datavalidering"
        required: true
        type: choice
        default: "data/kundbas.csv"
        options:
          - "data/kundbas.csv"
          - "data/kundbas_ny_leverans.csv"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  andringar:
    name: Kontrollera ändrade filer
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      ci: ${{ steps.decision.outputs.ci }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Identifiera relevanta ändringar
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci:
              - 'src/**'
              - 'k8s/**'
              - 'data/**'
              - 'tests/**'
              - 'kontroller/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Dockerfile'
              - 'docker/**'
              - '.dockerignore'
              - 'scripts/**'

      - name: Bestäm om CI behövs
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.ci }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$CHANGED" == "true" ]]; then
            echo "ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: andringar
    if: needs.andringar.outputs.ci == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen --no-sync --python "${{ matrix.python-version }}" python -m pytest -v

  datakontroll:
    name: Validate customer data
    needs: andringar
    if: needs.andringar.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Validate original customer data
        env:
          DATAFIL: ${{ inputs.datafil || 'data/kundbas.csv' }}
        run: uv run --frozen --no-sync python -m kontroller.validate_data "$DATAFIL"

  train:
    name: Train model
    needs: [test, datakontroll]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Train model
        env:
          MLFLOW_RUN_NAME: model-ci-${{ github.run_number }}-${{ github.run_attempt }}
        run: uv run --frozen --no-sync python -m churn.model

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

      # Keep the database and artifact files together.
      - name: Package MLflow results
        run: tar -czf mlflow-tracking.tar.gz mlflow.db mlruns/

      # Save the archive for this workflow run.
      - name: Upload MLflow results
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-${{ github.sha }}
          path: mlflow-tracking.tar.gz
          if-no-files-found: error

  utvardera:
    name: Evaluate model
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Evaluate model quality
        run: uv run --frozen --no-sync python -m churn.evaluate

      - name: Write metrics to Summary
        if: always()
        run: |
          if [ -f outputs/matvarden.json ]; then
            echo "## Model evaluation" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Build and smoke-test Docker image (${{ matrix.arch }})
    needs: utvardera
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Both architectures use the same approved model artifact.
      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Verify model commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              Path("outputs/matvarden.json").read_text()
          )
          actual = metadata["commit"]
          expected = os.environ["EXPECTED_SHA"]

          if actual != expected:
              raise SystemExit(
                  f"Model commit mismatch: {actual} != {expected}"
              )

          print("PASS: Model commit matches workflow commit")
          PY

      # Each runner builds for its own architecture.
      - name: Build Docker image
        run: docker build -t churn-docker:ci .

      - name: Run Docker smoke-test
        run: bash scripts/smoke_test.sh churn-docker:ci

      - name: Run API smoke-test
        run: bash scripts/smoke_test_api.sh churn-docker:ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Separate tags prevent the two builds from overwriting each other.
      - name: Tag and publish approved image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          TAG="$IMAGE:$COMMIT_SHA-$ARCH"

          docker tag churn-docker:ci "$TAG"
          docker push "$TAG"

          echo "Published: $TAG"

      - name: Pull and verify published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:$COMMIT_SHA-$ARCH"

          docker image rm "$IMAGE"
          docker pull "$IMAGE"
          bash scripts/smoke_test.sh "$IMAGE"
          bash scripts/smoke_test_api.sh "$IMAGE"

          echo "PASS: Published image pulled and verified"

  image_manifest:
    name: Publish multi-platform image
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The common SHA tag points to both tested platform images.
      - name: Create multi-platform image tag
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"

          docker buildx imagetools create \
            --tag "$IMAGE:$COMMIT_SHA" \
            "$IMAGE:$COMMIT_SHA-amd64" \
            "$IMAGE:$COMMIT_SHA-arm64"

      - name: Verify published platforms
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:$COMMIT_SHA"

          docker buildx imagetools inspect "$IMAGE"
          docker buildx imagetools inspect --raw "$IMAGE" > image-manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("image-manifest.json").read_text())
          platforms = {
              (
                  item.get("platform", {}).get("os"),
                  item.get("platform", {}).get("architecture"),
              )
              for item in manifest.get("manifests", [])
          }

          required = {("linux", "amd64"), ("linux", "arm64")}
          if not required.issubset(platforms):
              raise SystemExit(f"Missing required platforms: {platforms}")

          print("PASS: Published image supports linux/amd64 and linux/arm64")
          PY

  staging:
    name: Deploy to kind (staging)
    needs: image_manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      REPOSITORY: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This cluster exists only for the current CI job.
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: staging
          wait: 120s

      - name: Pull the published image into kind
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:$EXPECTED_SHA"
          docker exec staging-control-plane crictl pull "$IMAGE"

      - name: Deploy the tested version
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:$EXPECTED_SHA"

          # Replace the image before applying the Deployment.
          kubectl --context kind-staging set image --local \
            -f k8s/deployment.yaml api="$IMAGE" -o yaml \
            | kubectl --context kind-staging apply -f -

          kubectl --context kind-staging apply -f k8s/service.yaml
          kubectl --context kind-staging rollout status deployment/saldes --timeout=180s

      - name: Verify health and prediction in Kubernetes
        run: |
          kubectl --context kind-staging port-forward service/saldes 18080:80 \
            > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT

          python - <<'PY'
          import json
          import math
          import os
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:18080"
          expected = os.environ["EXPECTED_SHA"]

          for attempt in range(30):
              try:
                  with urlopen(f"{base}/health", timeout=2) as response:
                      health = json.load(response)
                  break
              except (URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise SystemExit("FAIL: Kubernetes API did not become reachable")

          assert health["status"] == "ok", health
          assert health["model_sha"] == expected, health

          customer = {
              "alder": 35,
              "region": "Stockholm",
              "abonnemang": "Standard",
              "manader_som_kund": 12,
              "manadskostnad": 299.0,
              "data_gb_per_manad": 20.0,
              "supportarenden_12m": 2,
          }
          request = Request(
              f"{base}/predict",
              data=json.dumps(customer).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=10) as response:
              prediction = json.load(response)

          probability = prediction["churn_probability"]
          assert math.isfinite(probability) and 0 <= probability <= 1, prediction
          assert prediction["model_sha"] == expected, prediction
          print(json.dumps(prediction))
          print("PASS: Staging responds with the expected model version")
          PY

      - name: Show Kubernetes diagnostics
        if: failure()
        run: |
          kubectl --context kind-staging get pods -o wide || true
          kubectl --context kind-staging describe deployment saldes || true
          kubectl --context kind-staging get events --sort-by=.metadata.creationTimestamp || true
          kubectl --context kind-staging logs -l app=saldes --all-containers=true --tail=100 --prefix=true || true


  ringlista:
    name: Generate call list
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Generate call list
        run: uv run --frozen --no-sync python -m churn.score

      - name: Upload call list
        uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error

  ci_gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()

    needs:
      - andringar
      - test
      - datakontroll
      - train
      - utvardera
      - docker
      - image_manifest
      - staging

    steps:
      - name: Kontrollera pipeline-resultat
        env:
          CHANGES_RESULT: ${{ needs.andringar.result }}
          CI_REQUIRED: ${{ needs.andringar.outputs.ci }}
          TEST_RESULT: ${{ needs.test.result }}
          DATA_RESULT: ${{ needs.datakontroll.result }}
          TRAIN_RESULT: ${{ needs.train.result }}
          EVAL_RESULT: ${{ needs.utvardera.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          MANIFEST_RESULT: ${{ needs.image_manifest.result }}
          STAGING_RESULT: ${{ needs.staging.result }}
          PUBLISH_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Ändringskontrollen misslyckades."
            exit 1
          fi

          if [[ "$CI_REQUIRED" == "false" ]]; then
            echo "Endast irrelevanta PR-ändringar. Fullständig CI behövs inte."
            exit 0
          fi

          if [[ "$CI_REQUIRED" != "true" ]]; then
            echo "Ogiltigt värde för CI_REQUIRED."
            exit 1
          fi

          for result in "$TEST_RESULT" "$DATA_RESULT" "$TRAIN_RESULT" "$EVAL_RESULT" "$DOCKER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "CI misslyckades: minst ett obligatoriskt jobb har resultat $result"
              exit 1
            fi
          done

          if [[ "$PUBLISH_REQUIRED" == "true" && "$MANIFEST_RESULT" != "success" ]]; then
            echo "Publiceringen av imagen för båda plattformarna misslyckades."
            exit 1
          fi

          if [[ "$PUBLISH_REQUIRED" == "true" && "$STAGING_RESULT" != "success" ]]; then
            echo "Utrullningen i kind misslyckades."
            exit 1
          fi

          echo "Alla obligatoriska CI-jobb passerade."
